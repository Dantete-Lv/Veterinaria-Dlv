<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patitas Felices</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            🐾 Clínica Veterinaria Patitas Felices
        </span>
    </div>
</nav>


<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Dueños</h2>

        <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalNuevoDueno">
            + Nuevo Dueño
        </button>
    </div>


    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Email</th>
            </tr>
            </thead>

            <tbody id="tablaDuenos">
            </tbody>
        </table>
    </div>

</main>

<div
        class="modal fade"
        id="modalNuevoDueno"
        tabindex="-1"
        aria-labelledby="modalNuevoDuenoLabel"
        aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalNuevoDuenoLabel">
                    Nuevo Dueño
                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                </button>
            </div>


            <div class="modal-body">

                <div
                        id="mensajeError"
                        class="alert alert-danger d-none">
                </div>


                <form id="formDueno">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                required>
                    </div>


                    <div class="mb-3">
                        <label for="apellido" class="form-label">
                            Apellido
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="apellido"
                                required>
                    </div>


                    <div class="mb-3">
                        <label for="dni" class="form-label">
                            DNI
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="dni"
                                required>
                    </div>


                    <div class="mb-3">
                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="telefono">
                    </div>


                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                class="form-control"
                                id="email"
                                required>
                    </div>

                </form>

            </div>


            <div class="modal-footer">

                <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button
                        type="submit"
                        form="formDueno"
                        class="btn btn-primary">
                    Crear Dueño
                </button>

            </div>

        </div>
    </div>
</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    const API_URL = "http://localhost:8080/api/duenios";


    // ==========================================
    // GET - Listar dueños
    // ==========================================

    async function cargarDuenos() {

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Error al obtener los dueños");
            }

            const duenos = await response.json();

            const tabla = document.getElementById("tablaDuenos");

            tabla.innerHTML = "";

            duenos.forEach(dueno => {

                const fila = document.createElement("tr");

                fila.innerHTML = `
                    <td>${dueno.id ?? ""}</td>
                    <td>${dueno.nombre ?? ""}</td>
                    <td>${dueno.apellido ?? ""}</td>
                    <td>${dueno.dni ?? ""}</td>
                    <td>${dueno.telefono ?? ""}</td>
                    <td>${dueno.email ?? ""}</td>
                `;

                tabla.appendChild(fila);
            });

        } catch (error) {

            console.error(error);

            alert("No se pudieron cargar los dueños.");
        }
    }


    // ==========================================
    // POST - Crear dueño
    // ==========================================

    document
        .getElementById("formDueno")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const mensajeError =
                document.getElementById("mensajeError");

            mensajeError.classList.add("d-none");
            mensajeError.textContent = "";


            const dueno = {

                nombre:
                    document.getElementById("nombre").value,

                apellido:
                    document.getElementById("apellido").value,

                dni:
                    document.getElementById("dni").value,

                telefono:
                    document.getElementById("telefono").value,

                email:
                    document.getElementById("email").value
            };


            try {

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(dueno)
                });


                if (!response.ok) {

                    let mensaje = `Error ${response.status}`;

                    try {

                        const errorResponse =
                            await response.json();

                        if (errorResponse.message) {
                            mensaje = errorResponse.message;
                        }

                    } catch (e) {
                        // Si la respuesta no es JSON,
                        // usamos el mensaje genérico.
                    }

                    throw new Error(mensaje);
                }


                // Cerrar modal
                const modalElement =
                    document.getElementById("modalNuevoDueno");

                const modal =
                    bootstrap.Modal.getInstance(modalElement);

                modal.hide();


                // Limpiar formulario
                document
                    .getElementById("formDueno")
                    .reset();


                // Actualizar tabla
                cargarDuenos();

            } catch (error) {

                mensajeError.textContent = error.message;

                mensajeError.classList.remove("d-none");
            }

        });


    // Cargar dueños al abrir la página
    document.addEventListener(
        "DOMContentLoaded",
        cargarDuenos
    );

</script>

</body>
</html>
